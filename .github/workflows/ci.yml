name: CI

on:
  push:
    branches: [main, feat/codex-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Run offline tests
        run: uv run --no-sync pytest -q
      - name: Lint application and test code
        if: matrix.python-version == '3.12'
        run: uv run --no-sync ruff check .

  smoke-install:
    name: clean locked install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
      - run: uv sync --locked --no-dev --no-editable
      - name: Import installed package away from checkout
        working-directory: /tmp
        run: $GITHUB_WORKSPACE/.venv/bin/python -c "import tradingagents, cli.main; print('clean-install import OK')"

  container:
    name: container privacy and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add private-file canaries outside packaging inputs
        run: |
          mkdir -p reports .codex cli/reports
          touch reports/private-build-canary .env.enterprise .codex/auth.json cli/.env.private cli/reports/private-build-canary tradingagents/custom-credentials.secret
      - name: Build API runtime with locked dependencies
        run: |
          docker build --target builder -t tradingagents-builder-ci .
          docker run --rm --entrypoint python tradingagents-builder-ci -c "from pathlib import Path; forbidden={'private-build-canary', '.env.enterprise', '.env.private', 'auth.json', 'custom-credentials.secret'}; assert not any(p.name in forbidden for p in Path('/build').rglob('*')); print('private files excluded from builder')"
          docker build -t tradingagents-ci .
      - name: Check runtime import and private-file exclusion
        run: |
          docker run --rm --entrypoint python tradingagents-ci -c "import cli.main, tradingagents; from pathlib import Path; roots=[Path('/home/appuser'), Path('/opt/venv')]; forbidden={'private-build-canary', '.env.enterprise', '.env.private', 'auth.json', 'custom-credentials.secret'}; assert not any(p.name in forbidden for root in roots for p in root.rglob('*')); Path('reports').mkdir(); Path('reports/write-check').write_text('OK'); print('private files excluded; report directory writable')"
